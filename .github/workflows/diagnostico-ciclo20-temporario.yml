name: Validação editorial ciclo 20 temporária

on:
  push:
    branches: [content/ciclo-editorial-20]
    paths:
      - '.github/workflows/diagnostico-ciclo20-temporario.yml'

permissions:
  contents: write

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: content/ciclo-editorial-20
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci
      - name: Aplicar refinamento editorial
        run: python3 scripts/refinar-ciclo20-temporario.py
      - name: Validar integridade e currículo
        run: npm run validar
      - name: Compilar portal
        run: npm run build
      - name: Conferir estado e README
        run: npm run conferir
      - name: Recalcular fila editorial
        run: npm run priorizar
      - name: Versionar refinamento validado
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/conteudo/pastoral/ritos-provas-julgamento.ts
          git commit -m 'Completar controvérsia processual do ciclo 20'
          git push origin HEAD:content/ciclo-editorial-20
