name: Regenerar TH04 temporariamente

on:
  push:
    branches: [content/ciclo-editorial-17]
    paths:
      - '.github/workflows/regenerar-th04-temporario.yml'

permissions:
  contents: write

jobs:
  regenerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: content/ciclo-editorial-17
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci
      - name: Regenerar currículo a partir do PDF original
        run: npm run regenerar:curriculo
      - name: Mostrar unidades dos casos contaminados
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const ds = JSON.parse(await readFile('src/dados/ementas.json', 'utf8'));
          const codigos = ['CG04','CG65','TE12','TE17','TE20','TE21','TE22','TH05','TP04','TP05','TS04','TS08'];
          for (const codigo of codigos) {
            const d = ds.find((x) => x.codigo === codigo);
            console.log(`\n=== ${codigo} | ${d?.titulo} | pagina ${d?.paginaPdf} ===`);
            console.log(JSON.stringify({preRequisito:d?.preRequisito, ementa:d?.ementa, unidades:d?.unidades}, null, 2));
          }
          NODE
      - name: Validar currículo regenerado
        run: npm run validar:curriculo
