name: Regenerar TH04 temporariamente

on:
  push:
    branches: [content/ciclo-editorial-17]
    paths:
      - '.github/workflows/regenerar-th04-temporario.yml'

permissions:
  contents: write

jobs:
  regenerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: content/ciclo-editorial-17
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci
      - name: Regenerar currículo a partir do PDF original
        run: npm run regenerar:curriculo
      - name: Mostrar bibliografias suspeitas
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const ds = JSON.parse(await readFile('src/dados/ementas.json', 'utf8'));
          const re = /\bUnidade\s+\d+\b|\bBIBLIOGRAFIA\b/i;
          for (const d of ds) {
            for (const grupo of ['basica', 'complementar']) {
              const itens = d.bibliografia?.[grupo] ?? [];
              itens.forEach((item, i) => {
                if (re.test(String(item))) {
                  console.log(`\n=== ${d.codigo} | ${grupo} #${i + 1} ===`);
                  console.log(String(item));
                }
              });
            }
          }
          NODE
      - name: Validar currículo regenerado
        run: npm run validar:curriculo
      - name: Versionar artefato regenerado
        if: success()
        run: |
          if git diff --quiet -- src/dados/ementas.json; then
            echo 'Nenhuma alteração em ementas.json.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/dados/ementas.json
          git commit -m 'Regenerar currículo com correção auditada de TH04'
          git push origin HEAD:content/ciclo-editorial-17
