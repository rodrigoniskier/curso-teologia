name: Validação ciclo 19 temporária

on:
  push:
    branches: [content/ciclo-editorial-19]
    paths:
      - '.github/workflows/diagnostico-ciclo19-temporario.yml'

permissions:
  contents: write

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: content/ciclo-editorial-19
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci
      - name: Corrigir referência compartilhada e sincronizar README
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/conteudo/historica/inglaterra-contrarreforma.ts')
          s = p.read_text(encoding='utf-8')
          antigo = 'https://ccel.org/ccel/schaff/creeds2.toc.html'
          novo = 'https://ccel.org/ccel/schaff/creeds2/creeds2.toc.html'
          if s.count(antigo) != 1:
            raise SystemExit(f'URL antiga: esperada 1 ocorrência; encontradas {s.count(antigo)}')
          p.write_text(s.replace(antigo, novo), encoding='utf-8')

          p = Path('README.md')
          s = p.read_text(encoding='utf-8')
          pares = [
            ('| Verbetes redigidos | 182 |', '| Verbetes redigidos | 186 |'),
            ('| Obras livres mapeadas | 210 |', '| Obras livres mapeadas | 214 |'),
            ('A diferença entre 182 verbetes e 101 disciplinas cobertas', 'A diferença entre 186 verbetes e 101 disciplinas cobertas'),
          ]
          for antigo, novo in pares:
            if s.count(antigo) != 1:
              raise SystemExit(f'esperada 1 ocorrência de {antigo!r}; encontradas {s.count(antigo)}')
            s = s.replace(antigo, novo)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Validar integridade e currículo
        run: npm run validar
      - name: Compilar portal
        run: npm run build
      - name: Conferir estado e README
        run: npm run conferir
      - name: Recalcular fila editorial
        run: npm run priorizar
      - name: Versionar ajustes validados
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md src/conteudo/historica/inglaterra-contrarreforma.ts
          git commit -m 'Sincronizar referências e contagens do ciclo 19'
          git push origin HEAD:content/ciclo-editorial-19
