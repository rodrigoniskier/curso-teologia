name: Diagnosticar TP09 temporariamente

on:
  push:
    branches:
      - content/curriculo-integral-03-tp09

permissions:
  contents: read

jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Imprimir programa oficial e acervo TP09
        run: |
          node --input-type=module <<'NODE'
          import { readFile, readdir } from 'node:fs/promises';
          import { join } from 'node:path';
          const ementas = JSON.parse(await readFile('src/dados/ementas.json', 'utf8'));
          const d = ementas.find(x => x.codigo === 'TP09');
          console.log('=== PROGRAMA TP09 ===');
          console.log(JSON.stringify(d, null, 2));
          console.log('\n=== VERBETES TP09 ===');
          const caminhar = async dir => {
            const out=[];
            for (const e of await readdir(dir,{withFileTypes:true})) {
              const p=join(dir,e.name);
              if(e.isDirectory()) out.push(...await caminhar(p));
              else if(e.name.endsWith('.ts')) out.push(p);
            }
            return out;
          };
          for (const p of await caminhar('src/conteudo')) {
            const t=await readFile(p,'utf8');
            if (/disciplina:\s*['\"]TP09['\"]/.test(t)) {
              const id=t.match(/\bid:\s*['\"]([^'\"]+)/)?.[1];
              const titulo=t.match(/\btitulo:\s*['\"]([^'\"]+)/)?.[1];
              const unidade=t.match(/\bunidade:\s*(\d+)/)?.[1];
              console.log(JSON.stringify({p,id,titulo,unidade: unidade ? Number(unidade) : null}));
            }
          }
          console.log('\n=== FONTES ASSOCIADAS A TP09 ===');
          for (const p of await caminhar('src/dados')) {
            if (!/biblioteca.*\.ts$/.test(p)) continue;
            const t=await readFile(p,'utf8');
            const blocos=t.split(/\n\s*\},?\n/);
            for (const b of blocos) {
              if (/['\"]TP09['\"]/.test(b)) {
                const id=b.match(/\bid:\s*['\"]([^'\"]+)/)?.[1];
                const titulo=b.match(/\btitulo:\s*['\"]([^'\"]+)/)?.[1];
                const url=b.match(/\burl:\s*['\"]([^'\"]+)/)?.[1];
                if(id) console.log(JSON.stringify({p,id,titulo,url}));
              }
            }
          }
          NODE
