name: Limpar hotfix UNIFAL temporariamente

on:
  push:
    branches:
      - fix/unifal-normalizacao-estavel

permissions:
  contents: write

jobs:
  limpar:
    if: github.event.head_commit.message == 'Preparar autolimpeza do workflow temporário UNIFAL'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/unifal-normalizacao-estavel
      - name: Remover este workflow do ramo
        run: |
          git config user.name 'dev.Rodrigo Niskier'
          git config user.email 'niskier.rodrigo@gmail.com'
          git rm .github/workflows/hotfix-unifal-temporario.yml
          git commit -m 'Remover workflow temporário do hotfix UNIFAL'
          git push origin HEAD:fix/unifal-normalizacao-estavel
