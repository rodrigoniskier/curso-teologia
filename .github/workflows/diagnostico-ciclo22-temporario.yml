name: Validação ciclo 22 temporária

on:
  push:
    branches: [content/ciclo-editorial-22]
    paths:
      - '.github/workflows/diagnostico-ciclo22-temporario.yml'

permissions:
  contents: write

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: content/ciclo-editorial-22
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci
      - name: Registrar ferramentas abertas e atualizar contagens
        run: |
          python3 - <<'PY'
          from pathlib import Path

          extra = Path('src/dados/biblioteca-extra.ts')
          s = extra.read_text(encoding='utf-8')
          marcador = "export const bibliotecaExtra: ObraLivre[] = [\n"
          entradas = """  {\n    id: 'sblgnt', autor: 'Michael W. Holmes (ed.)', ano: '2010', titulo: 'The Greek New Testament: SBL Edition', publicacao: 'Society of Biblical Literature', url: 'https://www.sblgnt.com/', idioma: 'grc', acesso: 'livre', disciplinas: ['TE16'], nota: 'Texto grego criticamente editado e disponibilizado gratuitamente pela Society of Biblical Literature. A própria SBL esclarece que seu aparato registra diferenças entre edições publicadas e não substitui um aparato manuscritológico completo.', base: 'edição autorizada',\n  },\n  {\n    id: 'stepbible', autor: 'Tyndale House, Cambridge', ano: '—', titulo: 'STEP Bible', publicacao: 'Tyndale House', url: 'https://www.stepbible.org/', idioma: 'en', acesso: 'livre', disciplinas: ['TE16'], nota: 'Ferramenta gratuita de leitura e pesquisa bíblica com recursos de línguas originais, busca e análise. Útil para conferência e exploração de dados; não substitui gramáticas, léxicos, edições críticas nem julgamento exegético.', base: 'edição autorizada',\n  },\n"""
          if "id: 'sblgnt'" not in s:
              if marcador not in s:
                  raise SystemExit('marcador da biblioteca-extra não encontrado')
              s = s.replace(marcador, marcador + entradas, 1)
              extra.write_text(s, encoding='utf-8')

          readme = Path('README.md')
          s = readme.read_text(encoding='utf-8')
          trocas = [
              ('| Verbetes redigidos | 192 |', '| Verbetes redigidos | 195 |'),
              ('| Obras livres mapeadas | 215 |', '| Obras livres mapeadas | 217 |'),
              ('A diferença entre 192 verbetes e 101 disciplinas cobertas', 'A diferença entre 195 verbetes e 101 disciplinas cobertas'),
          ]
          for antigo, novo in trocas:
              if antigo not in s and novo not in s:
                  raise SystemExit(f'texto do README não encontrado: {antigo}')
              s = s.replace(antigo, novo, 1)
          readme.write_text(s, encoding='utf-8')
          PY
      - name: Validar integridade e currículo
        run: npm run validar
      - name: Auditar metadados
        run: npm run auditar:metadados
      - name: Compilar portal
        run: npm run build
      - name: Conferir estado
        run: npm run conferir
      - name: Priorizar próximo ciclo
        run: npm run priorizar
      - name: Auditar todas as fontes
        run: node scripts/auditar-links.mjs --relatorio
      - name: Versionar ajustes permanentes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md src/dados/biblioteca-extra.ts
          git commit -m 'Registrar fontes e contagens do ciclo 22'
          git push origin HEAD:content/ciclo-editorial-22
