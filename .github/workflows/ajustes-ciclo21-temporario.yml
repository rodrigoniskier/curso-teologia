name: Ajustes ciclo 21 temporário

on:
  push:
    branches: [content/ciclo-editorial-21]
    paths:
      - '.github/workflows/ajustes-ciclo21-temporario.yml'

permissions:
  contents: write

jobs:
  ajustar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: content/ciclo-editorial-21
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci
      - name: Atualizar biblioteca e contagens
        run: |
          python3 - <<'PY'
          from pathlib import Path

          extra = Path('src/dados/biblioteca-extra.ts')
          s = extra.read_text(encoding='utf-8')
          marcador = "export const bibliotecaExtra: ObraLivre[] = [\n"
          entrada = """  {\n    id: 'westminster-directory-1645', autor: 'Assembleia de Westminster', ano: '1645', titulo: 'A Directory for the Publike Worship of God', publicacao: 'Internet Archive / Westminster Assembly Project', url: 'https://archive.org/details/bim_early-english-books-1641-1700_a-directory-for-the-publ_1645_0', idioma: 'en', acesso: 'livre', disciplinas: ['TS09', 'TS08'], nota: 'Fac-símile público da edição de 1645, indicado pelo Westminster Assembly Project. Fonte primária para leitura pública, oração, pregação, sacramentos, Dia do Senhor, casamento, visitação, funerais, jejum, ações de graças e canto no horizonte da Assembleia de Westminster.', base: 'domínio público',\n  },\n"""
          if "id: 'westminster-directory-1645'" not in s:
              if marcador not in s:
                  raise SystemExit('marcador da biblioteca-extra não encontrado')
              s = s.replace(marcador, marcador + entrada, 1)
              extra.write_text(s, encoding='utf-8')

          bib = Path('src/dados/biblioteca.ts')
          s = bib.read_text(encoding='utf-8')
          antigo_julian = "disciplinas: ['CG59', 'TS08', 'TH04'],"
          novo_julian = "disciplinas: ['CG59', 'TS08', 'TS09', 'TH04'],"
          if antigo_julian not in s and novo_julian not in s:
              raise SystemExit('mapeamento de julian-hinologia não encontrado')
          s = s.replace(antigo_julian, novo_julian, 1)

          antigo_manual = "disciplinas: ['TP12', 'TP13', 'TP02', 'TP06', 'TS11', 'TP52', 'TH06', 'CG55'],"
          novo_manual = "disciplinas: ['TP12', 'TP13', 'TP02', 'TP06', 'TS09', 'TS11', 'TP52', 'TH06', 'CG55'],"
          if antigo_manual not in s and novo_manual not in s:
              raise SystemExit('mapeamento do Manual Presbiteriano não encontrado')
          s = s.replace(antigo_manual, novo_manual, 1)
          bib.write_text(s, encoding='utf-8')

          readme = Path('README.md')
          s = readme.read_text(encoding='utf-8')
          trocas = [
              ('| Verbetes redigidos | 189 |', '| Verbetes redigidos | 192 |'),
              ('| Obras livres mapeadas | 214 |', '| Obras livres mapeadas | 215 |'),
              ('A diferença entre 189 verbetes e 101 disciplinas cobertas', 'A diferença entre 192 verbetes e 101 disciplinas cobertas'),
          ]
          for antigo, novo in trocas:
              if antigo not in s and novo not in s:
                  raise SystemExit(f'texto do README não encontrado: {antigo}')
              s = s.replace(antigo, novo, 1)
          readme.write_text(s, encoding='utf-8')
          PY
      - name: Validar integridade e currículo
        run: npm run validar
      - name: Auditar metadados
        run: npm run auditar:metadados
      - name: Compilar portal
        run: npm run build
      - name: Conferir estado
        run: npm run conferir
      - name: Priorizar próximo ciclo
        run: npm run priorizar
      - name: Auditar todas as fontes
        run: node scripts/auditar-links.mjs --relatorio
      - name: Versionar ajustes permanentes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md src/dados/biblioteca.ts src/dados/biblioteca-extra.ts
          git commit -m 'Registrar fontes e contagens do ciclo 21'
          git push origin HEAD:content/ciclo-editorial-21
