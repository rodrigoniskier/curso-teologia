name: Diagnóstico estrutural integral temporário

on:
  push:
    branches:
      - refactor/curriculo-integral-avaliacoes
    paths:
      - 'scripts/diagnostico-estrutura-integral-temporario.mjs'
      - '.github/workflows/diagnostico-estrutura-integral-temporario.yml'

permissions:
  contents: read

jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/curriculo-integral-avaliacoes
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: node scripts/diagnostico-estrutura-integral-temporario.mjs
