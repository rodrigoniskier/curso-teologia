name: Aplicar painel curricular temporário

on:
  push:
    branches:
      - refactor/curriculo-integral-avaliacoes
    paths:
      - 'scripts/aplicar-painel-disciplina-temporario.mjs'
      - '.github/workflows/aplicar-painel-disciplina-temporario.yml'

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/curriculo-integral-avaliacoes
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: node scripts/aplicar-painel-disciplina-temporario.mjs
      - name: Publicar integração
        run: |
          git config user.name 'dev.Rodrigo Niskier'
          git config user.email 'niskier.rodrigo@gmail.com'
          git add src/paginas/Disciplina.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'Integrar cobertura e avaliações à página de disciplina'
          git push origin HEAD:refactor/curriculo-integral-avaliacoes
