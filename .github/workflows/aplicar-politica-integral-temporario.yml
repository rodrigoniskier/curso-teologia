name: Aplicar política curricular integral temporária

on:
  push:
    branches:
      - refactor/curriculo-integral-avaliacoes

permissions:
  contents: write

jobs:
  aplicar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/curriculo-integral-avaliacoes
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Aplicar transformações documentais
        run: node scripts/aplicar-politica-integral-temporario.mjs
      - name: Publicar documentação e métricas
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md CLAUDE.md scripts/progresso-editorial.mjs scripts/estado.mjs
          if git diff --cached --quiet; then
            echo 'Nada a publicar.'
          else
            git commit -m 'Fixar política de currículo integral e avaliações'
            git push origin HEAD:refactor/curriculo-integral-avaliacoes
          fi
