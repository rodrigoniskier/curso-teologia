name: Validar TP21 temporariamente

on:
  push:
    branches:
      - content/curriculo-integral-02-tp21

permissions:
  contents: write

jobs:
  sincronizar:
    if: github.event.head_commit.message != 'Sincronizar main em TP21'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: content/curriculo-integral-02-tp21
          fetch-depth: 0
      - name: Incorporar main ao ramo
        run: |
          git config user.name 'dev.Rodrigo Niskier'
          git config user.email 'niskier.rodrigo@gmail.com'
          git fetch origin main
          git merge origin/main --no-edit -m 'Sincronizar main em TP21'
          git push origin HEAD:content/curriculo-integral-02-tp21

  incorporar_avaliacoes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: content/curriculo-integral-02-tp21
      - name: Incorporar arquivo temporário ao banco de questões
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          temporario = Path('scripts/tp21-questoes-temporarias.json')
          if not temporario.exists():
              raise SystemExit(0)
          banco_path = Path('src/dados/questoes.json')
          banco = json.loads(banco_path.read_text())
          novas = json.loads(temporario.read_text())
          existentes = {q['id'] for q in banco}
          repetidas = [q['id'] for q in novas if q['id'] in existentes]
          if repetidas:
              raise SystemExit(f'IDs já existentes: {repetidas}')
          banco.extend(novas)
          banco_path.write_text(json.dumps(banco, ensure_ascii=False, indent=2) + '\n')
          temporario.unlink()
          PY
      - name: Publicar banco consolidado
        run: |
          git config user.name 'dev.Rodrigo Niskier'
          git config user.email 'niskier.rodrigo@gmail.com'
          git add src/dados/questoes.json scripts/tp21-questoes-temporarias.json || true
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Adicionar AV1 e AV2 de TP21'
          git push origin HEAD:content/curriculo-integral-02-tp21

  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: content/curriculo-integral-02-tp21
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci
      - name: Validar materiais
        run: npm run validar:materiais
      - name: Validar integridade integral
        run: npm run validar
      - name: Build de produção
        run: npm run build
      - name: Estado curricular
        run: npm run progresso:curriculo
