name: Auditoria de fontes

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  links:
    name: Verificar todas as fontes citadas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Auditar links
        env:
          NODE_OPTIONS: --dns-result-order=ipv4first
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            node scripts/auditar-links.mjs --relatorio --tolerante
          else
            node scripts/auditar-links.mjs --relatorio
          fi
      - name: Publicar relatório no resumo
        if: always()
        run: cat relatorio-auditoria.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Guardar relatório
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: relatorio-auditoria
          path: |
            relatorio-auditoria.md
            relatorio-auditoria.json
          retention-days: 30

  build:
    name: Compilar e validar o portal
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci

      # Passagem única do ciclo C. O script regenera ementas.json, remove os
      # overlays de runtime, instala o gate permanente e se apaga antes do commit.
      - name: Finalizar arquitetura curricular
        if: github.event_name == 'pull_request' && github.head_ref == 'maintenance/curriculo-regeneravel'
        run: |
          python3 scripts/extracao/finalizar-ciclo-c.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Tornar currículo regenerável sem overlay em runtime'
          git push origin HEAD:${{ github.head_ref }}

      - name: Testar regras de infraestrutura
        run: node --test scripts/lib/*.test.mjs
      - name: Validar integridade do conteúdo
        run: npm run validar
      - name: Auditar coerência semântica dos metadados
        run: npm run auditar:metadados
      - run: npm run build
      - name: Conferir os números do README
        run: npm run conferir
      - name: Verificar diagnóstico editorial
        run: npm run priorizar -- --json > /dev/null
