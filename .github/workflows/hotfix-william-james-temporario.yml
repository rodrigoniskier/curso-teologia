name: Hotfix William James temporário

on:
  push:
    branches: [content/ciclo-editorial-22]
    paths:
      - '.github/workflows/hotfix-william-james-temporario.yml'

permissions:
  contents: write

jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: content/ciclo-editorial-22
      - name: Localizar e substituir todas as referências antigas
        run: |
          python3 - <<'PY'
          from pathlib import Path
          old = 'varietiesofrelig00jameuoft'
          new = 'thevarieties00jameuoft'
          alterados = []
          for p in Path('src').rglob('*'):
              if not p.is_file():
                  continue
              try:
                  s = p.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              if old in s:
                  print(f'corrigindo: {p}')
                  p.write_text(s.replace(old, new), encoding='utf-8')
                  alterados.append(str(p))
          if not alterados:
              raise SystemExit('Nenhuma referência antiga encontrada em src')
          print(f'{len(alterados)} arquivo(s) corrigido(s)')
          PY
          if grep -R -n 'varietiesofrelig00jameuoft' src; then
            echo 'Ainda há referência antiga em src'
            exit 1
          fi
      - name: Versionar correção
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src
          git commit -m 'Estabilizar edição de William James'
          git push origin HEAD:content/ciclo-editorial-22
